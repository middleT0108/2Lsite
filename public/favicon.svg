<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Nền hình tròn bo góc - gaming style -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#7c3aed" />
  <!-- Viền phát sáng -->
  <rect x="4" y="4" width="56" height="56" rx="14" stroke="#a78bfa" stroke-width="2" opacity="0.6" />
  <!-- Nút play triangle -->
  <polygon points="26,18 26,46 48,32" fill="white" />
  <!-- Hiệu ứng phản chiếu nhẹ -->
  <rect x="4" y="4" width="56" height="28" rx="14" fill="white" opacity="0.08" />
</svg>
